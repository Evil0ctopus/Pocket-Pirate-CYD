name: Release firmware

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name to create/use (e.g. v0.2.0); leave empty to build only"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build cheap-black-display
        run: pio run -e cheap-black-display

      - name: Stage firmware binary
        run: |
          mkdir -p dist
          cp .pio/build/cheap-black-display/firmware.bin \
             dist/Pocket-Pirate-CYD-cheap-black-display.bin
          ls -la dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pocket-pirate-release-bin
          path: dist/*.bin

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Pocket-Pirate-CYD-cheap-black-display.bin
          generate_release_notes: true
          body: |
            ## Pocket Pirate CYD firmware

            Flash with PlatformIO or esptool:

            ```bash
            # PlatformIO (from a clone)
            pio run -e cheap-black-display -t upload

            # Or esptool (USB CDC / UART0)
            esptool.py --chip esp32s3 --port PORT write_flash 0x0 \
              Pocket-Pirate-CYD-cheap-black-display.bin
            ```

            Passive / metadata-only RF. See README for GPS wiring and companion protocol.
