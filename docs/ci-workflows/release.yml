name: Release firmware

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name to create/use (e.g. v0.3.0); leave empty to build only"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO + esptool
        run: |
          python -m pip install --upgrade pip
          pip install platformio esptool

      - name: Build cheap-black-display
        run: pio run -e cheap-black-display

      - name: Package merged factory image (0x0)
        run: |
          python tools/package_firmware.py \
            -o dist/Pocket-Pirate-CYD-cheap-black-display.bin
          # Also keep the app-only image for OTA (HTTPUpdate expects app @ 0x10000 layout)
          cp .pio/build/cheap-black-display/firmware.bin \
             dist/Pocket-Pirate-CYD-cheap-black-display-app.bin
          ls -la dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pocket-pirate-release-bin
          path: dist/*.bin

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Pocket-Pirate-CYD-cheap-black-display.bin
            dist/Pocket-Pirate-CYD-cheap-black-display-app.bin
          generate_release_notes: true
          body: |
            ## Pocket Pirate CYD firmware

            **Factory image** (`…-cheap-black-display.bin`) = bootloader + partitions + app.
            Flash at **0x0**:

            ```bash
            esptool.py --chip esp32s3 --port PORT write_flash 0x0 \
              Pocket-Pirate-CYD-cheap-black-display.bin
            ```

            **App-only** (`…-app.bin`) is for OTA / `HTTPUpdate` (not for raw 0x0 flash).

            Passive / metadata-only RF. See README + `docs/OTA.md`.
