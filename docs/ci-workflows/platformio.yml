name: PlatformIO CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO + esptool
        run: |
          python -m pip install --upgrade pip
          pip install platformio esptool

      - name: Build cheap-black-display
        run: pio run -e cheap-black-display

      - name: Package merged factory image
        run: python tools/package_firmware.py

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: pocket-pirate-firmware
          path: |
            dist/Pocket-Pirate-CYD-cheap-black-display.bin
            .pio/build/cheap-black-display/firmware.bin
            .pio/build/cheap-black-display/firmware.elf
