[env:cheap-black-display]
; Resolves to the installed pioarduino platform (Arduino-ESP32 3.x), which
; provides the esp32-s3-devkitc1-n16r8 board profile.
platform = espressif32
board = esp32-s3-devkitc1-n16r8
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DPP_VERSION=\"0.2.0\"
lib_deps =
    lovyan03/LovyanGFX
    mikalhart/TinyGPSPlus@^1.0.3
